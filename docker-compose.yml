# Local demo deployment. Ports bind to 127.0.0.1 only. Credentials come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerguard
      POSTGRES_USER: ledgerguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard -d ledgerguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      LEDGERGUARD_DB_URL: jdbc:postgresql://postgres:5432/ledgerguard
      LEDGERGUARD_DB_USER: ledgerguard
      LEDGERGUARD_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LEDGERGUARD_DEMO_PASSWORD: ${LEDGERGUARD_DEMO_PASSWORD:?Set LEDGERGUARD_DEMO_PASSWORD in .env}
      # The Simulation Lab is a local-demo feature. Keep it off for any shared deployment.
      LEDGERGUARD_SIMULATION_ENABLED: ${LEDGERGUARD_SIMULATION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
